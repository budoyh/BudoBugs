[agents]
enabled = true
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "high"

[mcp_servers.budobugs]
command = "uv"
args = ["run", "python", "-m", "budobugs.mcp.server"]
enabled = false
required = false
enabled_tools = ["engagement_show", "status", "traffic_search", "finding_show"]
default_tools_approval_mode = "prompt"

[mcp_servers.budobugs.tools.engagement_show]
approval_mode = "approve"

[mcp_servers.budobugs.tools.status]
approval_mode = "approve"
