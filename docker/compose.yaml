name: budobugs-lab

x-limits-small: &limits-small
  deploy:
    resources:
      limits:
        cpus: "0.75"
        memory: 512M

services:
  fixture:
    build:
      context: ..
      dockerfile: docker/labs/fixture/Dockerfile
    image: budobugs/fixture:local
    read_only: true
    tmpfs: [/tmp]
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [lab]
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    <<: *limits-small

  juice-shop:
    image: bkimminich/juice-shop:v20.1.1@sha256:cd58d79c5cb4d82f22fbaf616f9ff43bbd04ba630cd6b448a9ed99cf652fcebf
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [lab]
    healthcheck:
      test: [CMD, /nodejs/bin/node, -e, "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
    <<: *limits-small

  webgoat:
    image: webgoat/webgoat:v2025.3@sha256:3101bd9e7bcfe122d7ef91e690ef3720de36cc4e86b3d06763a1ddf2e2751a4b
    environment:
      WEBGOAT_HOST: 0.0.0.0
      WEBWOLF_HOST: 0.0.0.0
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [lab]
    healthcheck:
      test: [CMD, bash, -c, "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 8s
      retries: 40
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M

  crapi-keygen:
    image: alpine:3.22.2@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412
    command: [sh, /keygen/generate.sh]
    volumes:
      - crapi-keys:/keys
      - ./labs/crapi/generate.sh:/keygen/generate.sh:ro
      - ./labs/crapi/jwks.fixture.json:/keygen/jwks.fixture.json:ro
    networks: [lab]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  crapi-postgres:
    image: postgres:14.19-alpine3.22@sha256:cb54bb67c0fca8b439f18c1daadb315ad67de1faf8c387988c63080d15a54145
    command: [postgres, -c, max_connections=500]
    environment: &crapi-db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: crapisecretpassword
      POSTGRES_DB: crapi
    volumes: [crapi-postgres:/var/lib/postgresql/data]
    networks: [lab]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U admin -d crapi"]
      interval: 10s
      timeout: 5s
      retries: 30
    <<: *limits-small

  crapi-mongo:
    image: mongo:4.4.29@sha256:52c42cbab240b3c5b1748582cc13ef46d521ddacae002bbbda645cebed270ec0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: crapisecretpassword
    volumes: [crapi-mongo:/data/db]
    networks: [lab]
    healthcheck:
      test: [CMD, mongo, --quiet, --eval, "quit(db.runCommand({ping:1}).ok ? 0 : 2)"]
      interval: 10s
      timeout: 5s
      retries: 30
    <<: *limits-small

  crapi-mailhog:
    image: crapi/mailhog:1.1.6-rc8@sha256:c3a74b1f63673996aec82f175ad4dd49cc3152637f68dc3dfc9f765e06c0f5e9
    environment:
      MH_MONGO_URI: admin:crapisecretpassword@crapi-mongo:27017
      MH_STORAGE: mongodb
    networks: [lab]
    depends_on:
      crapi-mongo: {condition: service_healthy}
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, "8025"]
      interval: 10s
      timeout: 5s
      retries: 30
    <<: *limits-small

  crapi-identity:
    image: crapi/crapi-identity:1.1.6-rc8@sha256:5152eaa8b25d8585068ec478c9a2ee886ce1658d8289fd047f83325737490f78
    environment: &crapi-common
      LOG_LEVEL: INFO
      DB_NAME: crapi
      DB_USER: admin
      DB_PASSWORD: crapisecretpassword
      DB_HOST: crapi-postgres
      DB_PORT: "5432"
      SERVER_PORT: "8080"
      MONGO_DB_HOST: crapi-mongo
      MONGO_DB_PORT: "27017"
      MONGO_DB_USER: admin
      MONGO_DB_PASSWORD: crapisecretpassword
      MONGO_DB_NAME: crapi
      JWT_SECRET: crapi-local-fixture
      JWT_EXPIRATION: "604800000"
      MAILHOG_HOST: crapi-mailhog
      MAILHOG_PORT: "1025"
      MAILHOG_DOMAIN: example.com
      SMTP_HOST: crapi-mailhog
      SMTP_PORT: "1025"
      SMTP_EMAIL: fixture@example.com
      SMTP_PASS: fixture-not-a-secret
      SMTP_FROM: no-reply@example.com
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
      API_GATEWAY_URL: https://api.mypremiumdealership.com
      ENABLE_LOG4J: "false"
      ENABLE_SHELL_INJECTION: "false"
      TLS_ENABLED: "false"
    volumes: [crapi-keys:/app/keys:ro]
    networks: [lab]
    depends_on:
      crapi-keygen: {condition: service_completed_successfully}
      crapi-postgres: {condition: service_healthy}
      crapi-mongo: {condition: service_healthy}
      crapi-mailhog: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/health.sh]
      interval: 15s
      timeout: 10s
      retries: 30
    <<: *limits-small

  crapi-community:
    image: crapi/crapi-community:1.1.6-rc8@sha256:ff62181b9089df60379c1cecdcfceb0f54ea6d6c4d7c407bb2f5fd55208f2be0
    environment:
      <<: *crapi-common
      IDENTITY_SERVICE: crapi-identity:8080
      SERVER_PORT: "8087"
    networks: [lab]
    depends_on:
      crapi-identity: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/health.sh]
      interval: 15s
      timeout: 10s
      retries: 30
    <<: *limits-small

  crapi-workshop:
    image: crapi/crapi-workshop:1.1.6-rc8@sha256:b73a2e4aed1a62ba9c626214eca6b66289f2f5cced7169dbd791837edf263de6
    environment:
      <<: *crapi-common
      IDENTITY_SERVICE: crapi-identity:8080
      SERVER_PORT: "8000"
      SECRET_KEY: crapi-local-fixture
      FILES_LIMIT: "1000"
    networks: [lab]
    depends_on:
      crapi-community: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/health.sh]
      interval: 15s
      timeout: 10s
      retries: 30
    <<: *limits-small

  crapi-chromadb:
    image: chromadb/chroma:0.6.3@sha256:e0e78dc7609a599b63c99753442c7d01b1d3d369ce0e3bf3e0540536fec4fa7a
    environment:
      IS_PERSISTENT: "TRUE"
    volumes: [crapi-chromadb:/data]
    networks: [lab]
    healthcheck:
      test: [CMD, /bin/bash, -c, "cat < /dev/null > /dev/tcp/127.0.0.1/8000"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 20s
    <<: *limits-small

  crapi-chatbot:
    image: crapi/crapi-chatbot:1.1.6-rc8@sha256:82a2b54f13a378952ea0d40925c3229c7cc9876e3699dd29340c7392b4bd909f
    environment:
      TLS_ENABLED: "false"
      SERVER_PORT: "5002"
      WEB_SERVICE: crapi-web
      IDENTITY_SERVICE: crapi-identity:8080
      DB_NAME: crapi
      DB_USER: admin
      DB_PASSWORD: crapisecretpassword
      DB_HOST: crapi-postgres
      DB_PORT: "5432"
      MONGO_DB_HOST: crapi-mongo
      MONGO_DB_PORT: "27017"
      MONGO_DB_USER: admin
      MONGO_DB_PASSWORD: crapisecretpassword
      MONGO_DB_NAME: crapi
      API_USER: admin@example.com
      API_PASSWORD: Admin!123
      OPENAPI_SPEC: /app/resources/crapi-openapi-spec.json
      DEFAULT_MODEL: gpt-4o-mini
      CHROMA_HOST: crapi-chromadb
      CHROMA_PORT: "8000"
    networks: [lab]
    depends_on:
      crapi-mongo: {condition: service_healthy}
      crapi-identity: {condition: service_healthy}
      crapi-chromadb: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 5002), 2).close()"]
      interval: 15s
      timeout: 10s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  api.mypremiumdealership.com:
    image: crapi/gateway-service:1.1.6-rc8@sha256:111a996957c1e9f78fe401b4d9a16bb99e6d6a3aa836792382a52c9ecbd39c8c
    networks:
      lab:
        aliases: [api.mypremiumdealership.com]
    healthcheck:
      test: [CMD, bash, -c, "echo -n 'GET / HTTP/1.1\n\n' > /dev/tcp/127.0.0.1/443"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  crapi-web:
    image: crapi/crapi-web:1.1.6-rc8@sha256:6cbafa5085cc38199c5f16f71ad11579168e08ca25c22e9b89f55e423caa8746
    environment:
      COMMUNITY_SERVICE: crapi-community:8087
      IDENTITY_SERVICE: crapi-identity:8080
      WORKSHOP_SERVICE: crapi-workshop:8000
      CHATBOT_SERVICE: crapi-chatbot:5002
      MAILHOG_WEB_SERVICE: crapi-mailhog:8025
      TLS_ENABLED: "false"
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks: [lab]
    depends_on:
      crapi-workshop: {condition: service_healthy}
      crapi-chatbot: {condition: service_healthy}
      api.mypremiumdealership.com: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1/health"]
      interval: 15s
      timeout: 10s
      retries: 30
    <<: *limits-small

  zap:
    image: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    profiles: [extended]
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8090"
      - -config
      - api.disablekey=true
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [lab]
    volumes: [./profiles/zap-automation.yaml:/zap/wrk/automation.yaml:ro]
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:8090/JSON/core/view/version/"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  zap-automation:
    image: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    profiles: [zap-automation]
    command: [zap.sh, -cmd, -autorun, /zap/config/automation.yaml]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [lab]
    volumes:
      - ./profiles/zap-automation.yaml:/zap/config/automation.yaml:ro
      - ../.budobugs/zap:/zap/wrk
    depends_on:
      fixture: {condition: service_healthy}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  loopback-proxy:
    build:
      context: labs/loopback-proxy
      dockerfile: Dockerfile
    image: budobugs/loopback-proxy:local
    read_only: true
    tmpfs: [/tmp]
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      BUDO_PROXY_MAP: >-
        8765=fixture:8765,3000=juice-shop:3000,8080=webgoat:8080,
        9090=webgoat:9090,8888=crapi-web:80,8090=zap:8090
    ports:
      - "127.0.0.1:8765:8765"
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8090:8090"
    networks:
      loopback:
        gw_priority: 1
      lab:
        gw_priority: 0
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 8765), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      fixture: {condition: service_healthy}
      juice-shop: {condition: service_healthy}
      webgoat: {condition: service_healthy}
      crapi-web: {condition: service_healthy}
    <<: *limits-small

networks:
  lab:
    internal: true
  loopback:

volumes:
  crapi-keys:
  crapi-postgres:
  crapi-mongo:
  crapi-chromadb:
