title = "BudoBugs secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Documented fixture aliases and redacted placeholders"
paths = [
  '''^\.git/''',
  '''^\.budobugs/''',
  '''^\.venv/''',
  '''^node_modules/''',
  '''^(engagements|findings|runs)/''',
  '''(?:^|/)__pycache__/''',
  '''^release/''',
  '''fixtures/.*''',
  '''docker/labs/crapi/jwks\.fixture\.json''',
  '''\.env\.example''',
  '''docs/.*''',
]
regexes = [
  '''<REDACTED[^>]*>''',
  '''fixture-(alice|bob|admin)-token''',
  '''Z4G6z7pWQ92axYt5vLmE3sR8''',
]
