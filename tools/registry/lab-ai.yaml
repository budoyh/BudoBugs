tools:
  - &lab_ai
    name: pentestgpt
    category: lab-ai
    source: https://github.com/GreyDGL/PentestGPT
    version: e8b1bb77d1ac00329675cec3b060aba971ec1ac8
    commit: e8b1bb77d1ac00329675cec3b060aba971ec1ac8
    license: MIT
    profile: lab-ai
    executable: null
    container_image: null
    install_method: manual
    supported_platforms: [container]
    required_secrets: [OPENAI_API_KEY]
    network_behavior: [model API and Docker lab network]
    mutation_level: high
    resource_risk: high
    supported_modes: [lab]
    timeout: 1800
    concurrency: 1
    parser: external-agent-json
    healthcheck: [--help]
    output_schema: schemas/external-agent.schema.json
    redaction_rules: [all-secrets, pii]
